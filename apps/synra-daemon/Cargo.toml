[package]
name = "synra-daemon"
description = "The kernel's windowless host, which exists to prove the kernel needs no interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
synra-protocol = { path = "../../crates/synra-protocol" }
synra-store = { path = "../../crates/synra-store" }
# The domain model: the identity a device presents to its peers. `synra-core` depends on this crate in neither direction,
# so this is a leaf dependency and not a cycle.
synra-fetch = { path = "../../crates/synra-fetch" }
synra-core = { path = "../../crates/synra-core" }
# The peer registry is behind its own lock so a device listing does not wait for a socket read.
parking_lot.workspace = true
synra-observe = { path = "../../crates/synra-observe" }
# A plugin's `log` reaches the file the daemon already writes, so the crate that emits it names `tracing`
# rather than reaching it through another crate's re-export.
tracing = "0.1"
synra-platform = { path = "../../crates/synra-platform" }
synra-control = { path = "../../crates/synra-control" }
# The kernel holds the plugin seam but not an engine, so the host brings one. This is the only dependency here that
# compiles Wasmtime, and it is here on purpose: a daemon that cannot run a plugin is not the kernel's windowless form.
synra-plugin-host = { path = "../../crates/synra-plugin-host", features = ["wasm-runtime"] }
synra-plugin-api = { path = "../../crates/synra-plugin-api" }
synra-capability = { path = "../../crates/synra-capability" }
# A registry package is a gzip'd tar, and the extractor that refuses escaping entries lives in this crate. Naming it here
# keeps the install from growing a second unpacker with a second set of rules.
synra-registry = { path = "../../crates/synra-registry" }

clap = { workspace = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
# Independent SQLite corruption for production recovery tests.
rusqlite = { version = "0.40", features = ["bundled"] }
synra-net = { path = "../../crates/synra-net" }
synra-testkit = { path = "../../crates/synra-testkit" }
# A UI half is a `ui.zip`, so the install test has to be able to make one.
zip = { version = "2", default-features = false, features = ["deflate"] }
# And a registry package is a gzip'd tar, so the registry-install test has to be able to make one.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tar = "0.4"
proptest.workspace = true
# One test needs a nil device identifier, and the protocol refuses to produce one from a string or from `Default` — so it
# has to be built from a raw UUID.
uuid.workspace = true
# Signing fixtures for the scan's signature check. A hand-written `signature.json` cannot be genuine, and the case that
# matters is a **valid** document over **other** bytes — so the test that wants it has to sign something.
ed25519-dalek.workspace = true
base64.workspace = true

[lints]
workspace = true
