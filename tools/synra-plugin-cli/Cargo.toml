[package]
name = "synra-plugin-cli"
description = "The plugin author's tool: scaffold, build, verify, sign and publish"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
synra-protocol = { path = "../../crates/synra-protocol" }
synra-plugin-api = { path = "../../crates/synra-plugin-api" }
synra-plugin-host = { path = "../../crates/synra-plugin-host" }

clap = { workspace = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ed25519-dalek = { workspace = true }
# For `OsRng` alone. Reading the system's randomness by hand needs an `unsafe` block on Windows, which this workspace
# forbids everywhere — and a key from a weak source is one an attacker can forge, silently.
rand_core = { workspace = true }

[dev-dependencies]
rstest.workspace = true

[lints]
workspace = true