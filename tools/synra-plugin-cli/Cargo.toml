[package]
name = "synra-plugin-cli"
description = "The plugin author's tool: scaffold, build, verify, sign and publish"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
synra-protocol = { path = "../../crates/synra-protocol" }
synra-plugin-api = { path = "../../crates/synra-plugin-api" }
synra-plugin-host = { path = "../../crates/synra-plugin-host" }

clap = { workspace = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ed25519-dalek = { workspace = true }
# For `OsRng` alone. Reading the system's randomness by hand needs an `unsafe` block on Windows, which this workspace
# forbids everywhere — and a key from a weak source is one an attacker can forge, silently.
rand_core = { workspace = true }
# The artifact and manifest digests a signature covers, and the base64 a signature document carries them in. Both are
# already in the tree through the contract crate, and named here because a tool that computes a digest should say which
# implementation it trusts.
sha2.workspace = true
base64.workspace = true
# The npm-shaped archive a registry serves: gzip around tar, written deterministically so two packs of unchanged files
# match byte for byte.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tar = "0.4"

[dev-dependencies]
rstest.workspace = true
# The test unpacker is the one the registry install runs, so "the archive is well formed" means "the installer reads it".
synra-registry = { path = "../../crates/synra-registry" }

[lints]
workspace = true