[package]
name = "synra-plugin-cli"
description = "The plugin author's tool: scaffold, build, verify, sign and publish"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "synra-plugin"
path = "src/main.rs"

[features]
rust-guest-tests = ["synra-plugin-host/wasm-runtime"]

[[test]]
name = "rust_guest"
required-features = ["rust-guest-tests"]

[dependencies]
wit-component = "=0.247.0"
tempfile = "3"

synra-protocol = { path = "../../crates/synra-protocol" }
synra-plugin-api = { path = "../../crates/synra-plugin-api" }
synra-plugin-host = { path = "../../crates/synra-plugin-host" }
# `publish` checks a tarball with the unpacker the installing side runs, so "the archive is well formed" means what it
# means at install time.
synra-registry = { path = "../../crates/synra-registry" }
# `publish --verify` reads the bucket back through the same network guard the host uses, so a URL the host would refuse is
# refused here too.
synra-fetch = { path = "../../crates/synra-fetch" }
synra-core = { path = "../../crates/synra-core" }

clap = { workspace = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ed25519-dalek = { workspace = true }
# For `OsRng` alone. Reading the system's randomness by hand needs an `unsafe` block on Windows, which this workspace
# forbids everywhere — and a key from a weak source is one an attacker can forge, silently.
rand_core = { workspace = true }
# The artifact and manifest digests a signature covers, and the base64 a signature document carries them in. Both are
# already in the tree through the contract crate, and named here because a tool that computes a digest should say which
# implementation it trusts.
sha2.workspace = true
base64.workspace = true
# The npm-shaped archive a registry serves: gzip around tar, written deterministically so two packs of unchanged files
# match byte for byte.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tar = "0.4"

[dev-dependencies]
rstest.workspace = true
toml_edit = "=0.25.17"

[lints]
workspace = true
