[package]
name = "synra-control"
description = "The channel between a command-line client and a kernel on the same machine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# The stable error codes, so a refusal cannot invent a spelling or a retryability that the rest of the system disagrees
# with. The protocol crate is pure data and pure rules, so this adds no weight.
synra-protocol = { path = "../synra-protocol" }

# A unix domain socket on Linux and macOS, a named pipe on Windows, behind one API. The alternative was two
# platform-specific implementations of framing, timeouts and half-close — and one of them would be the one nobody ran.
interprocess = "2.4"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[lints]
workspace = true