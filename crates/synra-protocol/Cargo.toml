[package]
name = "synra-protocol"
description = "Synra wire protocol: frames, envelopes, events, sessions. Pure data — no I/O."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["synra", "protocol", "lan"]
categories = ["network-programming"]

# 未发布：接口和数据格式可直接重构，并同步调用方与验证；边界规则见 STABILITY.md。
# ★ 无 IO 依赖是硬约束：tokio / rusqlite / wasmtime / tauri 一律不得出现。
[dependencies]
serde.workspace = true
serde_json.workspace = true
compact_str.workspace = true
bytes.workspace = true
rand_core.workspace = true
smallvec.workspace = true
uuid.workspace = true
time.workspace = true
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true
rstest.workspace = true
serde_json.workspace = true
# The counting allocator behind `tests/hot_path_alloc.rs`. It is a separate crate because a `GlobalAlloc`
# implementation is `unsafe` and this workspace `forbid`s unsafe code — which no local `allow` can relax, so the one
# place the exception can be stated is a crate of its own.
synra-testkit-alloc = { path = "../synra-testkit-alloc" }

[lints]
workspace = true
