[package]
name = "synra-store"
description = "Persistence: the schema, the plugin sandbox, and secret storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# The engine the migrations are written for. `bundled` rather than the system's copy: a kernel that used whatever SQLite
# the machine happened to have would behave differently on machines with different versions, and `foreign_keys` — the
# pragma that makes the schema's `ON DELETE CASCADE` mean anything — is exactly the sort of thing a version can change.
rusqlite = { version = "0.40", features = ["bundled"] }
synra-protocol = { path = "../synra-protocol" }

serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
parking_lot.workspace = true
zip.workspace = true

[dev-dependencies]
proptest.workspace = true
rstest.workspace = true

[lints]
workspace = true