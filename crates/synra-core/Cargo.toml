[package]
name = "synra-core"
description = "The kernel: domain model, aggregates, state machines and orchestration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
synra-protocol = { path = "../synra-protocol" }
synra-capability = { path = "../synra-capability" }
synra-plugin-api = { path = "../synra-plugin-api" }
# The installer unpacks a plugin's UI bundle, and `synra-plugin-ui` is the crate that owns unpacking (design 06). No cycle:
# it depends on protocol/api/capability only.
synra-plugin-ui = { path = "../synra-plugin-ui" }
# A published `.tgz` is opened by the same extractor the registry client uses: the traversal and size rules are the
# security argument, and a second copy here would be a second place for one of them to be forgotten.
synra-registry = { path = "../synra-registry" }
synra-plugin-host = { path = "../synra-plugin-host" }
synra-net = { path = "../synra-net" }
synra-store = { path = "../synra-store" }
synra-platform = { path = "../synra-platform" }
synra-observe = { path = "../synra-observe" }

serde.workspace = true
serde_json.workspace = true
# The package container: a `.synra` is a zip of the directory the installer takes, and the same reader unpacks a UI
# bundle. `synra-plugin-ui` already depends on this version, so naming it here adds no download.
zip = { version = "2", default-features = false, features = ["deflate"] }
thiserror.workspace = true
parking_lot.workspace = true
# The frame body is the protocol's own `Bytes`, so the peer layer names it rather than copying into a `Vec`.
bytes.workspace = true
# The transfer layer names its own digest implementation: a whole-object check is the thing that decides whether a file
# arrived, so which hash computes it is a decision rather than an implementation detail.
sha2.workspace = true
# Cross-process exclusion for identity secret writers without holding SQLite across backend IO.
fs2 = "=0.4.3"
base64.workspace = true

[dev-dependencies]
# Encode intent result fixtures against the production WIT contract.
wit-component = "0.247"
wit-parser = "0.247"
# Fault injection removes metadata through a second real SQLite connection.
rusqlite = { version = "0.40", features = ["bundled"] }
synra-testkit = { path = "../synra-testkit", features = ["wasm-fixtures"] }
ed25519-dalek.workspace = true
proptest.workspace = true
rstest.workspace = true
tempfile = "3"
# The hot-path assertions reach across the workspace — a frame decoder, a capability match, the gate, the router — so
# they live in the crate that already depends on all of them rather than in a crate that would have to gain four
# dependencies to host one test file.
synra-plugin-host = { path = "../synra-plugin-host", features = ["wasm-text"] }
synra-testkit-alloc = { path = "../synra-testkit-alloc" }
# ★ The real engine, for the tests that must run a **real** guest through the kernel.
#
# `wasm-runtime` is off by default in that crate, so without it these tests could only drive the scripted double — and a
# double cannot loop. A plugin that eats its instruction budget is the one failure no fixture can imitate: the whole point
# is that a real engine stops it. This costs nothing at run time, since the workspace already builds wasmtime.
#
# `.wat` rather than `.wasm`, so a reader can check four lines of text against what the test asserts.
wat = "1"

[lints]
workspace = true
