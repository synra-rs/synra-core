[package]
name = "synra-core"
description = "The kernel: domain model, aggregates, state machines and orchestration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
synra-protocol = { path = "../synra-protocol" }
synra-capability = { path = "../synra-capability" }
synra-plugin-api = { path = "../synra-plugin-api" }
synra-plugin-host = { path = "../synra-plugin-host" }
synra-net = { path = "../synra-net" }
synra-store = { path = "../synra-store" }
synra-platform = { path = "../synra-platform" }
synra-observe = { path = "../synra-observe" }

serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
parking_lot.workspace = true
# The frame body is the protocol's own `Bytes`, so the peer layer names it rather than copying into a `Vec`.
bytes.workspace = true
# The transfer layer names its own digest implementation: a whole-object check is the thing that decides whether a file
# arrived, so which hash computes it is a decision rather than an implementation detail.
sha2.workspace = true
base64.workspace = true

[dev-dependencies]
proptest.workspace = true
rstest.workspace = true
# The hot-path assertions reach across the workspace — a frame decoder, a capability match, the gate, the router — so
# they live in the crate that already depends on all of them rather than in a crate that would have to gain four
# dependencies to host one test file.
synra-plugin-host = { path = "../synra-plugin-host" }
synra-testkit-alloc = { path = "../synra-testkit-alloc" }

[lints]
workspace = true