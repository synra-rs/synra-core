[package]
name = "synra-plugin-sdk"
description = "What a Synra plugin is written against: the generated host bindings and the types they exchange"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# ★ `cdylib` because a plugin is a WebAssembly component, not a library another Rust crate links. The `rlib` is kept
# beside it so this crate's own tests can link it — a `cdylib`-only crate cannot be tested.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The contract's types, and nothing else. A plugin links this crate and therefore whatever it depends on, and a plugin
# artifact's size is a thing the user downloads.
synra-plugin-api = { path = "../synra-plugin-api" }

serde.workspace = true
serde_json.workspace = true

# ★ This crate names its clippy lints rather than inheriting the workspace's, and the reason is the one decision it makes
# differently: `clippy::todo` is denied by the workspace, and a generated binding is the one place a `todo!()` is
# correct. A body is a call into the component model, and the guest side of that call is generated by `wit-bindgen` — a
# build step this crate does not have yet — so the body genuinely is not written.
#
# `correctness = "deny"` is repeated with a lower priority than the `todo` exception, because the workspace sets it at
# priority -1 to make it unsuppressable and a `todo` in a generated file is a `todo` rather than a correctness bug.
#
# The alternative was `#[allow]` at each of the 35 generated functions, which is the same decision written 35 times.
[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
todo = { level = "allow", priority = 1 }
