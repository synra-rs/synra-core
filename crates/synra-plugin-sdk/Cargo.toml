[package]
name = "synra-plugin-sdk"
description = "What a Synra plugin is written against: the generated host bindings and the types they exchange"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# ★ `cdylib` because a plugin is a WebAssembly component, not a library another Rust crate links. The `rlib` is kept
# beside it so this crate's own tests can link it — a `cdylib`-only crate cannot be tested.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Only generated component glue is linked into the guest; manifest and signing belong to the host.
wit-bindgen = "=0.57.1"

[lints]
workspace = true

[dev-dependencies]
# ★ The same parser the host's build script uses, so the test that keeps the SDK and the contract the same size reads the
# **contract** rather than the table that script leaves on disk. Reading the generated artifact meant comparing a stale
# copy whenever only this crate was built — see the note on that test.
wit-codegen = { path = "../../tools/wit-codegen" }
