[package]
name = "synra-plugin-host"
description = "Plugin sandbox: capability gates, quotas, lifecycle and the instance pool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
synra-protocol = { path = "../synra-protocol" }
synra-capability = { path = "../synra-capability" }
synra-plugin-api = { path = "../synra-plugin-api" }
synra-observe = { path = "../synra-observe" }

serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
parking_lot.workspace = true
# The digest a cache key is built from, and the one a registry's integrity string names. Already in the tree through
# `ed25519-dalek`, and named rather than re-exported because a crate that computes a digest should say which
# implementation it trusts.
sha2.workspace = true
# An SRI digest is base64, and `signature.json` carries its key and signature the same way.
base64.workspace = true

# ── The engine ────────────────────────────────────────────────────────────────────────────────────────────────────
#
# ★ Optional, and off by default. It is a large dependency with a C toolchain under it, and this crate's own
# correctness — which instance a call gets, whether a deadline was armed, how a destination refuses — is testable
# without it: `engine::scripted` is the backend that exists when this is off, and every test of the execution layer
# runs against it.
#
# Turning it on is what makes the sandbox real: `cargo test -p synra-plugin-host --features wasm-runtime` compiles and
# instantiates an actual component. A build with it off cannot run a plugin at all, and `engine::Enforcement` is how a
# caller learns that rather than believing it has a bound it does not.
wasmtime = { version = "38", optional = true, default-features = false, features = [
  "component-model",
  "cranelift",
  "runtime",
  "std",
] }
# Only for the engine's own trait signatures: `ResourceLimiter` returns `anyhow::Result`. Nothing in this crate's own
# API carries it — the design document forbids `anyhow` in a public signature, and this is not one.
anyhow = { version = "1", optional = true }

[features]
default = []
# The Wasm engine, and the only configuration that can execute a plugin's code.
wasm-runtime = ["dep:wasmtime", "dep:anyhow"]
# Lets the engine read the text form of a component, which is what the tests are written in: a checked-in `.wasm` is a
# binary nobody reviews, and a `.wat` is four lines a reader can check against what the test asserts.
wasm-text = ["wasm-runtime", "wasmtime/wat"]

[dev-dependencies]
proptest.workspace = true
rstest.workspace = true
# The verify pipeline's tests sign a package, which needs a key and the same base64 a signature document carries.
synra-store = { path = "../synra-store" }
ed25519-dalek.workspace = true
base64.workspace = true

[build-dependencies]
# The generator, as a library. The table is regenerated before every build, so a contract change that is not
# reflected in it cannot produce a binary — see `build.rs`.
wit-codegen = { path = "../../tools/wit-codegen" }

# The build script is where the table is regenerated, and its only way to fail is a panic — see `build.rs`.
[lints]
workspace = true