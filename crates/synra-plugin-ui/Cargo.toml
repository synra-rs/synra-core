[package]
name = "synra-plugin-ui"
description = "UI plugin artifacts and the per-WebView session tokens that gate their calls"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
synra-protocol = { path = "../synra-protocol" }
synra-capability = { path = "../synra-capability" }
synra-plugin-api = { path = "../synra-plugin-api" }

serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
parking_lot.workspace = true
# ★ The UI half of a plugin arrives as `ui.zip` (design 01), and unpacking it is this crate's job (design 06: "解包/校验/
# 目录管理"). `default-features = false` plus `deflate` keeps out the compression backends a UI bundle never uses —
#
# and every one of them is code that would otherwise run on an attacker's input.
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
proptest.workspace = true
rstest.workspace = true

[lints]
workspace = true
