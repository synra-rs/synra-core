[workspace]

[package]
name = "spike-device-authentication"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
# Match the transport provider already used by the hosts; no system TLS or custom verifier.
# tls12 exists only to exercise refusal of an older client in the spike's tests.
rustls = { version = "=0.23.45", default-features = false, features = ["std", "ring", "tls12"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "ring"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
