[workspace]
resolver = "3"
members = [
  "crates/synra-ipc",
  "crates/synra-control",
  "crates/synra-core",
    "crates/synra-fetch",
  "crates/synra-capability",
  "crates/synra-observe",
  "crates/synra-plugin-api",
  "crates/synra-plugin-sdk",
  "crates/synra-net",
  "crates/synra-plugin-host",
  "crates/synra-plugin-ui",
  "crates/synra-platform",
  "crates/synra-testkit",
  "crates/synra-testkit-alloc",
  "crates/synra-store",
  "crates/synra-protocol",
  "apps/synra-cli",
  "tools/api-guard",
    "tools/doc-links",
  "tools/guards",
  "tools/matrix",
  "tools/synra-plugin-cli",
  "tools/wit-codegen",
  "apps/synra-daemon",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/synra-rs/synra-core"
authors = ["imba97 <mail@imba97.cn>"]

[workspace.dependencies]
# ── 外部：序列化与文本 ──
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["raw_value", "preserve_order"] }
compact_str = { version = "0.9", features = ["serde"] }

# ── 外部：字节与集合 ──
bytes = "1"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = "2"
rand_core = { version = "0.6", features = ["getrandom"] }
smallvec = { version = "1", features = ["serde", "union"] }

# ── 外部：标识与时间 ──
uuid = { version = "1", features = ["v7", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }

# ── 外部：错误 ──
thiserror = "2"
# The transfer layer's whole-object digest. Already in the tree through `ed25519-dalek`, so naming it adds no download —
# and it is named rather than re-exported because a crate that computes digests should say which implementation it trusts.
sha2 = "0.10"
# Digest values travel as base64 without padding, which is what `SriDigest` accepts.
base64 = "0.22"

# ── 外部：可观测性 ──
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "registry"] }
metrics = "0.24"

# ── 外部：并发原语 ──
parking_lot = "0.12"

# ── 外部：测试 ──
proptest = "1"
rstest = "0.24"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

# 严格 lint 集。内核不许 panic / unwrap / expect：所有失败路径都要给出结构化错误。
# 为什么这样严，以及改动时要注意什么，见 AGENT.md。
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# 正确性与可疑写法直接拒绝
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
# 内核里禁止 panic 系列
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
# 并发与异步的正确性
await_holding_lock = "deny"
async_yields_async = "deny"
future_not_send = "deny"
large_futures = "deny"
# 性能与分配
redundant_clone = "deny"
needless_pass_by_value = "deny"
significant_drop_tightening = "deny"
# 可读性
cognitive_complexity = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
use_self = "deny"
wildcard_imports = "deny"
missing_const_for_fn = "warn"

[profile.release]
# ★ unwind 而不是 abort：插件 panic 必须能被 catch_unwind 捕获
panic = "unwind"
lto = "thin"
codegen-units = 1
strip = "debuginfo"
